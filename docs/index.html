<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signit</title>
<script>
  // Signit מסמכים עבר לתוך Signit. קישורי חתימה ישנים ממשיכים לעבוד.
  if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (/\/docs\/$/.test(r.scope)) r.unregister(); }); });
  location.replace('../' + location.search + (location.search ? '' : '#docs'));
</script>
</head>
<body style="font-family:Arial,sans-serif;padding:24px">
<p>Signit מסמכים עבר לתוך Signit. <a href="../">המשך</a></p>
</body>
</html>
