<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signit</title>
<meta name="theme-color" content="#F7F3EA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#F7F3EA;color:#22303C;font-family:Arial,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F7F3EA}
  .setup{max-width:460px;margin:0 auto;padding:40px 20px}
  .setup img{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px}
  h1{text-align:center;margin:0 0 6px;font-size:24px}
  p{color:#6B7580;line-height:1.5;font-size:15px}
  input{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:12px;border:1px solid #E3DCCD;border-radius:12px;direction:ltr;text-align:left;background:#fff}
  button{width:100%;margin-top:12px;border:0;border-radius:999px;padding:14px;font:inherit;font-weight:700;font-size:16px;background:#22303C;color:#fff;box-sizing:border-box;display:block;text-align:center}
  .err{color:#D2402F;font-size:14px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<div id="root"></div>
<script>
  // הקישור הפרטי נשמר רק בטלפון הזה (localStorage) ולא בקוד של הדף
  var KEY = 'signit_owner_url';
  function valid(u) { return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\?k=[0-9a-f]{20,}$/.test(u); }
  function store(u) { try { localStorage.setItem(KEY, u); } catch (e) {} }
  function load() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }

  var h = location.hash.slice(1);
  if (h === 'reset') { try { localStorage.removeItem(KEY); } catch (e) {} history.replaceState(null, '', location.pathname); }
  else if (h.indexOf('u=') === 0) {
    var u = decodeURIComponent(h.slice(2));
    if (valid(u)) store(u);
    history.replaceState(null, '', location.pathname);
  }


  function start() {
    var u = load();
    var root = document.getElementById('root');
    if (u) {
      root.innerHTML = '<iframe src="' + u.replace(/"/g, '') + '" allow="camera; clipboard-write" title="Signit"></iframe>';
      return;
    }
    root.innerHTML =
      '<div class="setup"><img src="icon-192.png" alt=""><h1>Signit</h1>' +
      '<p>פעם אחת בלבד: הדביקו כאן את הקישור הפרטי לניהול (הקישור שנגמר ב-<b>?k=</b> ומספר ארוך). הוא נשמר רק בטלפון הזה.</p>' +
      '<input id="u" placeholder="https://script.google.com/macros/s/…/exec?k=…" autocomplete="off">' +
      '<div class="err" id="e"></div><button id="b">שמירה וכניסה</button></div>';
    document.getElementById('b').onclick = function () {
      var v = document.getElementById('u').value.trim();
      if (!valid(v)) { document.getElementById('e').textContent = 'זה לא נראה כמו הקישור הפרטי. צריך את הקישור המלא, כולל ?k='; return; }
      store(v); start();
    };
  }
  start();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
